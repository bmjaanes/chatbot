name: Web app tests

# Runs the browser tests in tests/web against the web app in docs/ (the
# GitHub Pages site) on every change. Runs on Linux, so it's quick and cheap.
on:
  push:
    paths:
      - "docs/**"
      - "tests/web/**"
      - "NextTime/NextTimeTests/Fixtures/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/web/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test

      - name: Keep the report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: |
            tests/web/playwright-report
            tests/web/test-results
